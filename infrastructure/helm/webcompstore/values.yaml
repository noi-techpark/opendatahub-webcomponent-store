# Default values for webcompstore.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ""
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetport: http
  containerport: 80

# Liveness/readiness probe tuning. The apps expose no health endpoint (no Spring
# actuator), so the HTTP port is probed via TCP.
health:
  delay: 5
  periodSeconds: 10
  failureThreshold: 6

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

# Workspace volume shared between the api (writes dist files and images uploaded via
# the CLI) and the cdn (serves them). Exactly one release creates the claim
# (persistence.create: true), the other mounts it by claimName.
persistence:
  enabled: false
  create: false
  claimName: ""
  storageClass: ""
  accessMode: ReadWriteMany
  size: 1Gi
  mountPath: /workspace

# A map of non-sensitive environment variables (key: value).
env: {}

# A map of sensitive environment variables. Rendered into a Secret and injected
# into the container via secretKeyRef. Populated at deploy time from CI secrets.
envSecret: {}

# A list of (name | secret | key) tuples mapping an env var to a key of an
# existing cluster Secret: env var "name" = secret.key
envSecretRef: []
